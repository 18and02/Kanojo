[project]
name = "kanojo-agent-backend"
version = "0.1.0"
description = "P1 backend for a memory-driven proactive desktop companion agent."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
stt = [
  "faster-whisper>=1.1.0",
  "python-multipart>=0.0.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
